services:
  - type: web
    name: fraudshield-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python app.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fraudshield-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  - name: fraudshield-db
    plan: free
    region: oregon
